version: 1

# Selección curatorial inicial, en orden de monitoreo.
# Solo estas fuentes se consultan automáticamente y únicamente mediante su RSS.
initial_source_ids:
  - michael_roberts
  - adam_tooze
  - paul_krugman

# Política de selección aplicada durante la ingesta y la revisión humana.
selection_policy:
  document_type: authored_blog_or_newsletter_post
  access: public_full_text
  topic: economic_crisis_broadly
  date_range: null # Se definirá al seleccionar los documentos.
  exclude:
    - reader_comments
    - navigation_and_subscription_prompts
    - partial_previews
    - audio_or_video_without_authored_text
    - link_lists_without_substantive_author_commentary
  tradition_note: "Etiquetas orientativas del proyecto, no exhaustivas; no predeterminan los mecanismos que se extraen."

sources:
  - id: michael_roberts
    author: Michael Roberts
    tradition: marxist
    publication: Michael Roberts Blog
    base_url: https://thenextrecession.wordpress.com/
    platform: wordpress
    language: en
    discovery: rss
    feed_url: https://thenextrecession.wordpress.com/feed/
    archive_url: https://thenextrecession.wordpress.com/blog/
    source_verified_at: "2026-09-07"
    access: public
    access_note: "Blog público; comprobar la integridad del cuerpo por artículo."
    enabled: true
    monitor: true
    extraction_status: ready
    selectors:
      title: "h1.entry-title"
      body: "div.entry-content"
      date: "time.entry-date"
      remove: ".sharedaddy, .sd-sharing-enabled, .jp-relatedposts, script, style, form, nav"

  - id: paul_krugman
    author: Paul Krugman
    tradition: new_keynesian
    publication: Paul Krugman
    base_url: https://paulkrugman.substack.com/
    platform: substack
    language: en
    about_url: https://paulkrugman.substack.com/about
    discovery: rss
    feed_url: https://paulkrugman.substack.com/feed
    archive_url: https://paulkrugman.substack.com/archive
    source_verified_at: "2026-09-07"
    access: mixed
    access_note: "Publicaciones mayoritariamente gratuitas y algunas de pago, según su página About; verificar cada artículo."
    enabled: true
    monitor: true
    extraction_status: ready
    selectors:
      title: "h1.post-title"
      body: ".available-content .body.markup"
      date: "time"
      remove: "script, style, form, button, .subscription-widget-wrap-editor"

  - id: thomas_piketty
    author: Thomas Piketty
    tradition: inequality_political_economy
    publication: Blog de Thomas Piketty
    base_url: https://www.lemonde.fr/blog/piketty/
    discovery: manual
    access: mixed_or_paywalled
    enabled: false
    note: "Relevant to the intellectual corpus, but excluded from the automatic pilot until access is handled cleanly."

  - id: dani_rodrik
    author: Dani Rodrik
    tradition: institutionalist_development
    publication: Dani Rodrik's Weblog
    base_url: https://rodrik.typepad.com/
    discovery: archive
    access: public
    enabled: false

  - id: adam_tooze
    author: Adam Tooze
    tradition: economic_history_political_economy
    publication: Chartbook
    base_url: https://adamtooze.substack.com/
    platform: substack
    language: en
    about_url: https://adamtooze.substack.com/about
    discovery: rss
    feed_url: https://adamtooze.substack.com/feed
    archive_url: https://adamtooze.substack.com/archive
    source_verified_at: "2026-09-07"
    access: mixed
    access_note: "Combina ensayos gratuitos y contenidos para suscriptores de pago, como Top Links; verificar cada artículo."
    enabled: true
    monitor: true
    extraction_status: ready
    selectors:
      title: "h1.post-title"
      body: ".available-content .body.markup"
      date: "time"
      remove: "script, style, form, button, .subscription-widget-wrap-editor"
      truncate_at: "I love putting out Chartbook."

  - id: brad_delong
    author: Brad DeLong
    tradition: new_keynesian_economic_history
    publication: Grasping Reality
    base_url: https://braddelong.substack.com/
    discovery: sitemap
    access: mixed
    enabled: false

  - id: steve_keen
    author: Steve Keen
    tradition: post_keynesian
    publication: Building a New Economics
    base_url: https://profstevekeen.substack.com/
    discovery: sitemap
    access: mixed
    enabled: true
    selectors:
      title: "h1"
      body: "article"
      date: "time"

  - id: simon_wren_lewis
    author: Simon Wren-Lewis
    tradition: new_keynesian
    publication: Mainly Macro
    base_url: https://mainlymacro.blogspot.com/
    discovery: rss
    access: public
    enabled: false
    selectors:
      title: "h3.post-title, h1"
      body: "div.post-body"
      date: "h2.date-header, time"

  - id: bill_mitchell
    author: Bill Mitchell
    tradition: modern_monetary_theory
    publication: William Mitchell - Modern Monetary Theory
    base_url: https://billmitchell.org/blog/
    discovery: rss
    access: public
    enabled: true
    selectors:
      title: "h1"
      body: "div.entry-content, article"
      date: "time, .entry-date"

  - id: john_cochrane
    author: John H. Cochrane
    tradition: new_classical_fiscal_theory
    publication: The Grumpy Economist
    base_url: https://www.grumpy-economist.com/
    discovery: sitemap
    access: mixed
    enabled: true
    selectors:
      title: "h1"
      body: "article"
      date: "time"

  - id: noah_smith
    author: Noah Smith
    tradition: eclectic_mainstream
    publication: Noahpinion
    base_url: https://www.noahpinion.blog/
    discovery: sitemap
    access: mixed
    enabled: false
