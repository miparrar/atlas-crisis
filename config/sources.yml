version: 2

# Fuentes con monitoreo e ingesta automática ya verificados.
# El catálogo curatorial completo está en `sources`.
monitored_source_ids:
  - michael_roberts
  - adam_tooze
  - paul_krugman

# Política de selección aplicada durante la ingesta y la revisión humana.
selection_policy:
  document_type: authored_blog_or_newsletter_post
  access: public_full_text
  topic: economic_crisis_broadly
  date_range: null # Se definirá al seleccionar los documentos.
  exclude:
    - reader_comments
    - navigation_and_subscription_prompts
    - partial_previews
    - audio_or_video_without_authored_text
    - link_lists_without_substantive_author_commentary
  tradition_note: "Etiquetas orientativas del proyecto, no exhaustivas; no predeterminan los mecanismos que se extraen."

sources:
  - id: michael_roberts
    author: Michael Roberts
    tradition: marxist_profitability_accumulation
    publication: The Next Recession
    focus: [rentabilidad, inversión, beneficios, crisis, deuda, inteligencia artificial]
    curatorial_note: "Marxismo clásico centrado en la tasa de ganancia y la acumulación como hipótesis estructural de fondo."
    base_url: https://thenextrecession.wordpress.com/
    platform: wordpress
    language: en
    discovery: rss
    feed_url: https://thenextrecession.wordpress.com/feed/
    archive_url: https://thenextrecession.wordpress.com/blog/
    source_verified_at: "2026-09-07"
    access: public
    access_note: "Blog público; comprobar la integridad del cuerpo por artículo."
    enabled: true
    monitor: true
    extraction_status: ready
    selectors:
      title: "h1.entry-title"
      body: "div.entry-content"
      date: "time.entry-date"
      remove: ".sharedaddy, .sd-sharing-enabled, .jp-relatedposts, script, style, form, nav"

  - id: adam_tooze
    author: Adam Tooze
    tradition: economic_history_political_economy
    publication: Chartbook
    focus: [macroeconomía mundial, guerras, China, Europa, inteligencia artificial, energía]
    curatorial_note: "Cartografía la coyuntura mundial conectando datos, acontecimientos y transformaciones geopolíticas."
    base_url: https://adamtooze.substack.com/
    platform: substack
    language: en
    about_url: https://adamtooze.substack.com/about
    discovery: rss
    feed_url: https://adamtooze.substack.com/feed
    archive_url: https://adamtooze.substack.com/archive
    source_verified_at: "2026-09-07"
    access: mixed
    access_note: "Combina ensayos gratuitos y contenidos para suscriptores de pago; verificar cada artículo."
    enabled: true
    monitor: true
    extraction_status: ready
    selectors:
      title: "h1.post-title"
      body: ".available-content .body.markup"
      date: "time"
